<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lista de Presença</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:#f3f5f8;color:#1b2430}
header{position:sticky;top:0;z-index:5;background:#16253b;color:#fff;padding:10px 14px}
header h1{margin:0;font-size:17px}header select{font-size:16px;font-weight:700;border-radius:6px;border:0;padding:2px 4px}header .sub{font-size:12px;opacity:.75}
.stats{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.chip{background:#ffffff1f;border-radius:14px;padding:3px 10px;font-size:13px}
.chip b{font-size:15px}.live{float:right;font-size:12px}.live i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#e55;margin-right:4px}.live.on i{background:#3c6}
.bar{display:flex;gap:8px;padding:10px 14px;flex-wrap:wrap}.bar input{flex:1;min-width:160px;padding:8px;border:1px solid #c5ccd6;border-radius:8px;font-size:15px}
.bar button{padding:8px 12px;border:0;border-radius:8px;background:#16253b;color:#fff;font-size:14px}
h2{margin:0}
.slot{--c:#1d5fd1;display:flex;align-items:center;justify-content:space-between;margin:22px 0 8px;padding:10px 14px;background:var(--c);color:#fff;border-radius:0;box-shadow:0 2px 6px #0003}
.slot .t{font-size:26px;font-weight:800;letter-spacing:.02em;line-height:1}.slot .t small{display:block;font-size:11px;font-weight:600;opacity:.85;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.slot .c{text-align:right;font-size:13px;line-height:1.25}.slot .c b{font-size:20px}
.slot .bar2{position:absolute;left:0;bottom:0;height:4px;background:#fff8;width:0}
.s0{--c:#1d5fd1}.s1{--c:#7a3fc4}.s2{--c:#0f8a7e}.s3{--c:#c25a12}.s4{--c:#b0275a}.sres{--c:#5b6677}
.grp{border-left:6px solid;margin:0 0 4px;padding-top:6px;border-color:transparent}
.grp.s0{border-color:#1d5fd1}.grp.s1{border-color:#7a3fc4}.grp.s2{border-color:#0f8a7e}.grp.s3{border-color:#c25a12}.grp.s4{border-color:#b0275a}.grp.sres{border-color:#5b6677}
.row{display:grid;grid-template-columns:54px 46px 1fr auto;gap:8px;align-items:center;background:#fff;margin:0 8px 6px 10px;padding:10px 10px;border-radius:10px;border:1px solid #dfe4ec;border-left:6px solid #b9c2cf;box-shadow:0 1px 2px #0001}
.row.presente{border-left-color:#1f9d4c;background:#e3f6ea;border-color:#b6e2c5}.row.atrasado{border-left-color:#e08a00;background:#fff0cf;border-color:#f0d18a}
.rota{font-weight:800;font-size:16px}.dsp{font-size:12px;color:#5a6a80}.nome{font-size:15px}.nome small{display:block;color:#7a8799;font-size:11px}
.btns{display:flex;gap:6px}.btns button{padding:10px 12px;border-radius:9px;border:1px solid #c5ccd6;background:#fff;font-size:14px;font-weight:600;min-width:84px}
.btns .p{color:#17703a}.btns .a{color:#9a5b00}.btns .p.on{background:#1f9d4c;color:#fff;border-color:#1f9d4c}.btns .a.on{background:#e08a00;color:#fff;border-color:#e08a00}
.obs{grid-column:1/-1}.obs input{width:100%;padding:7px;border:1px solid #d6dce5;border-radius:8px;font-size:14px}
#login{position:fixed;inset:0;background:#16253b;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:12px;z-index:10}
#login input{font-size:28px;text-align:center;width:160px;padding:8px;border-radius:10px;border:0;letter-spacing:.3em}
#login button{padding:10px 24px;font-size:16px;border:0;border-radius:10px}
#enc{margin:16px 10px 40px;padding:14px;background:#fff;border-radius:12px;text-align:center;border:1px solid #d6dce5}#enc button{padding:12px 18px;border:0;border-radius:10px;background:#16253b;color:#fff;font-size:15px;font-weight:600}#enc .ok{color:#2e9d57;font-weight:600}#enc .wait{color:#b57a00;font-weight:600}#enc small{display:block;margin-top:6px;color:#7a8799}
@media(max-width:560px){.row{grid-template-columns:48px 1fr auto}.dsp{display:none}.row .hh{display:none}}
</style></head><body>
<div id="login"><div style="font-size:20px">Lista de Presença</div><div>Digite o PIN</div><input id="pin" inputmode="numeric" maxlength="8" autofocus><button onclick="go()">Entrar</button><div id="err" style="color:#f99"></div></div>
<header><span class="live" id="live"><i></i><span>conectando</span></span><h1>Lista de Presença · <select id="est" onchange="setEst(this.value)"><option>DSP5</option><option>DCP5</option></select> · <span id="data"></span></h1><div class="sub" id="upd"></div><div class="stats" id="stats"></div></header>
<div class="bar"><input id="q" placeholder="Buscar nome ou rota" oninput="render()"><button onclick="addRow()">+ Adicionar</button></div>
<div id="list"></div><div id="enc"></div><div id="empty" style="display:none;padding:30px;text-align:center;color:#5a6a80">Lista ainda não carregada. Aguarde o dispatcher carregar a escala desta estação.</div>
<script>
const SB_URL='https://spuylttocotmljyrxdqa.supabase.co',SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNwdXlsdHRvY290bWxqeXJ4ZHFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2MTIxODYsImV4cCI6MjEwODE4ODE4Nn0.FW6wbqxO5rSkgUe8lU9WgVl2TVN-VotY3l_AUhAaR4I';
let EST=localStorage.getItem('est')||'DSP5',PIN=localStorage.getItem('pin')||'',S=null,timer=null,editing=false,lastOk=0;
const $=id=>document.getElementById(id);
const hd=()=>({apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json','x-pin':PIN});
const nowHM=()=>new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',timeZone:'America/Sao_Paulo'});
async function fetchRows(){const r=await fetch(SB_URL+'/rest/v1/lista?select=*&estacao=eq.'+EST+'&order=ord.asc',{headers:hd()});if(r.status===401||r.status===403)throw new Error('pin');if(!r.ok)throw new Error('net');return (await r.json()).map(x=>({id:x.id,rota:x.rota,hora:x.hora,dsp:x.dsp,nome:x.nome,reserva:x.reserva,status:x.status||'',marcadoEm:x.marcado_em||'',obs:x.obs||'',dia:x.dia}))}
async function go(){PIN=$('pin').value.trim();try{const rows=await fetchRows();localStorage.setItem('pin',PIN);$('login').style.display='none';S={rows};start()}catch(e){$('err').textContent='PIN inválido ou sem conexão'}}
$('pin').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
async function poll(){try{const rows=await fetchRows();await fetchEnc();renderEnc();lastOk=Date.now();S={rows};$('live').className='live on';$('live').lastChild.textContent='ao vivo';if(!editing)render()}catch(e){$('live').className='live';$('live').lastChild.textContent=e.message==='pin'?'PIN mudou':'reconectando'}}
function start(){render();clearInterval(timer);timer=setInterval(poll,2000);poll()}
function patch(id,b){return fetch(SB_URL+'/rest/v1/lista?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:hd(),body:JSON.stringify(b)})}
function setS(id,s){const r=S.rows.find(x=>x.id===id);const ns=r.status===s?'':s;r.status=ns;r.marcadoEm=ns?nowHM():'';render();patch(id,{status:ns,marcado_em:r.marcadoEm})}
let tm={};function setO(id,v){const r=S.rows.find(x=>x.id===id);if(r)r.obs=v;clearTimeout(tm[id]);tm[id]=setTimeout(()=>patch(id,{obs:v}),400)}
async function addRow(){const nome=prompt('Nome do motorista:');if(!nome)return;const rota=prompt('Rota (opcional, vazio = reserva):')||'';const hora=rota?(prompt('Horário (ex: 16:15):')||''):'';const dia=(S.rows[0]||{}).dia||'';await fetch(SB_URL+'/rest/v1/lista',{method:'POST',headers:hd(),body:JSON.stringify({id:EST+'-x'+Date.now(),estacao:EST,ord:9999,rota,hora,dsp:'',nome,reserva:!rota,dia})});poll()}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function rowH(r){return `<div class="row ${r.status}"><div class="rota">${esc(r.rota)||'—'}</div><div class="dsp">${esc(r.dsp)}</div><div class="nome">${esc(r.nome)}${r.marcadoEm?`<small>${r.status} às ${esc(r.marcadoEm)}</small>`:''}</div>
<div class="btns"><button class="p ${r.status==='presente'?'on':''}" onclick="setS('${r.id}','presente')">Presente</button><button class="a ${r.status==='atrasado'?'on':''}" onclick="setS('${r.id}','atrasado')">Atrasado</button></div>
<div class="obs"><input placeholder="Observação" value="${esc(r.obs)}" onfocus="editing=true" onblur="editing=false;render()" oninput="setO('${r.id}',this.value)"></div></div>`}
function render(){if(!S)return;$('data').textContent=(S.rows[0]||{}).dia||'';$('upd').textContent='Atualizado '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
 const q=$('q').value.toLowerCase();const rows=S.rows.filter(r=>!q||(r.nome+' '+r.rota).toLowerCase().includes(q));
 const c=k=>S.rows.filter(r=>r.status===k).length,tot=S.rows.length;
 $('stats').innerHTML=`<span class="chip">Total <b>${tot}</b></span><span class="chip">Presentes <b>${c('presente')}</b></span><span class="chip">Atrasados <b>${c('atrasado')}</b></span><span class="chip">Pendentes <b>${tot-c('presente')-c('atrasado')}</b></span>`;
 const g={};rows.filter(r=>!r.reserva).forEach(r=>(g[r.hora||'?']=g[r.hora||'?']||[]).push(r));
 let h='';const cnt=a=>({p:a.filter(r=>r.status==='presente').length,a:a.filter(r=>r.status==='atrasado').length,n:a.length});
 const hdr=(cls,k,sub,a)=>{const c=cnt(a),ok=c.p+c.a;return `<div class="slot ${cls}"><div class="t"><small>${sub}</small>${k}</div><div class="c"><b>${ok}/${c.n}</b> chegaram<br>${c.p} presentes · ${c.a} atrasados</div></div>`};
 Object.keys(g).sort().forEach((k,i)=>{const cls='s'+(i%5);h+=hdr(cls,k,'Saída',g[k])+`<div class="grp ${cls}">`+g[k].map(rowH).join('')+'</div>'});
 const rs=rows.filter(r=>r.reserva);if(rs.length)h+=hdr('sres','Reservas','Sem rota',rs)+'<div class="grp sres">'+rs.map(rowH).join('')+'</div>';
 $('empty').style.display=S.rows.length?'none':'block';
 const act=document.activeElement;if(act&&act.closest&&act.closest('.obs'))return;$('list').innerHTML=h}

let ENC={status:''};
function setEst(v){EST=v;localStorage.setItem('est',v);S={rows:[]};ENC={status:''};render();renderEnc();poll()}
$('est').value=EST;
async function fetchEnc(){const r=await fetch(SB_URL+'/rest/v1/encerramento?select=*&estacao=eq.'+EST+'&order=id',{headers:hd()});if(r.ok){const a=await r.json();ENC=a[0]||{status:''}}}
function renderEnc(){const e=ENC,b=`<button onclick="encerrar()">${e.status==='enviado'?'Enviar novamente':'Todos chegaram: encerrar e enviar'}</button>`;
 let h='';if(e.status==='pedido')h=`<div class="wait">Pedido feito às ${esc(e.pedido_em)}. Aguardando gerar o arquivo...</div><small>Pode levar alguns minutos.</small>`;
 else if(e.status==='enviado')h=`<div class="ok">Arquivo gerado às ${esc(e.enviado_em)}</div><small>${esc(e.arquivo)} (salvo na pasta Documentos do computador de quem carregou a lista)</small><div style="margin-top:10px">${b}</div>`;
 else h=b+'<small>Use quando todos os motoristas tiverem chegado.</small>';
 $('enc').innerHTML=h}
async function encerrar(){if(!confirm('Todos os motoristas já chegaram? Isso vai gerar o arquivo final desta estação.'))return;ENC={...ENC,status:'pedido',pedido_em:nowHM()};renderEnc();await fetch(SB_URL+'/rest/v1/encerramento?estacao=eq.'+EST,{method:'PATCH',headers:hd(),body:JSON.stringify({status:'pedido',pedido_em:nowHM(),enviado_em:'',arquivo:''})})}
if(PIN){fetchRows().then(rows=>{$('login').style.display='none';S={rows};start()}).catch(()=>{})}
</script></body></html>
